<!doctype html>
<meta charset="utf-8">
<title>casoCAD mesh worker smoke test</title>
<body data-result="pending">pending</body>
<script type="module">
const scene = {
  boundary_regions: {
    inlet: { outside_direction: 0, owner: "flow_volume" },
    outlet: { outside_direction: 1, owner: "flow_volume" },
  },
  domains: {
    von_karman_fluid: {
      root: "von_karman_fluid",
      tags: ["inlet", "outlet"],
      type: "fluid",
    },
  },
  format: "casocad",
  meshing: {
    algorithm_id: "advancing_front",
    element_min_size: 0.025,
    element_max_size: 0.06,
    control_script: "",
    wasm_file_cap_mib: 256,
  },
  objects: {
    cylinder_obstacle: {
      axes: {
        u: [0, 0, 1],
        v: [1, 0, 0],
        w: [0, 1, 0],
      },
      center: [1.8, 0, 0.5],
      height: 1.4,
      radius: 0.15,
      type: "cylinder",
    },
    flow_volume: {
      center: [2.25, 0, 0.5],
      size: [4.5, 3, 1],
      type: "box",
    },
    von_karman_fluid: {
      left: "flow_volume",
      right: "cylinder_obstacle",
      type: "difference",
    },
  },
  root_objects: ["von_karman_fluid"],
  unit: "m",
  version: 2,
};

const body = document.body;
const started = performance.now();
let previousBeat = started;
let maxHeartbeatGap = 0;
let artifactBytes = 0;
let previewPackets = 0;
let generations = 0;
let sessionId = 1;
let phase = "generate";
let worker;
let exportedFile;
let expectedCounts;
let roundtripCountsMatch = false;
const heartbeat = setInterval(() => {
  const now = performance.now();
  maxHeartbeatGap = Math.max(maxHeartbeatGap, now - previousBeat);
  previousBeat = now;
}, 25);

function finish(result, detail) {
  clearInterval(heartbeat);
  body.dataset.result = result;
  body.textContent = JSON.stringify({
    result,
    detail,
    artifactBytes,
    previewPackets,
    generations,
    maxHeartbeatGap,
    elapsedMillis: performance.now() - started,
  });
  worker?.terminate();
}

const timeout = setTimeout(() => finish("failed", "timeout"), 120_000);
const previewCommand = () => ({
  kind: "preview",
  session_id: sessionId,
  revision: generations,
  focus: [2.25, 0, 0.5],
  query: {
    x: { min: null, max: null },
    y: { min: null, max: null },
    z: { min: null, max: null },
    entity_kind: "Cell",
    zone_ids: [],
    tag_ids: [],
    tag_scope: null,
    measures: {
      quality: null,
      boundary_distance: false,
      adjacent_boundary_tags: false,
    },
    boundary_distance: null,
    display_limit: 4294967295,
  },
  style: "Catalog",
});

function startWorker() {
  worker = new Worker("../mesh_worker.js", { type: "module" });
  worker.onerror = event => finish("failed", event.message || "worker error");
  worker.onmessage = handleMessage;
}

function replaceWorker(nextPhase) {
  worker.terminate();
  phase = nextPhase;
  sessionId += 1;
  startWorker();
}

function handleMessage(event) {
  if (typeof event.data !== "string") {
    if (event.data?.kind === "download") {
      if (event.data.blob.size !== artifactBytes) {
        finish("failed", "exported Blob size differs from the worker artifact");
      } else {
        exportedFile = new File([event.data.blob], "roundtrip.casomesh.arrow");
        replaceWorker("load");
      }
    } else if (event.data?.kind === "preview_packet") {
      const bytes = event.data.floats.byteLength;
      previewPackets += 1;
      if (bytes > 1024 * 1024) {
        finish("failed", `preview packet is ${bytes} bytes`);
        return;
      }
      if (JSON.parse(event.data.meta).complete) {
        if (generations < 3) {
          replaceWorker("generate");
        } else {
          phase = "audit";
          worker.postMessage(JSON.stringify({
            kind: "audit_start",
            session_id: sessionId,
            request_id: 1,
          }));
        }
      }
    } else {
      finish("failed", "unknown binary worker response");
    }
    return;
  }

  const message = JSON.parse(event.data);
  if (message.kind === "ready") {
    if (phase === "generate") {
      worker.postMessage(JSON.stringify({
        kind: "generate",
        session_id: sessionId,
        scene: JSON.stringify(scene),
        cap_mib: 256,
      }));
    } else if (phase === "cap") {
      worker.postMessage(JSON.stringify({
        kind: "generate",
        session_id: sessionId,
        scene: JSON.stringify(scene),
        cap_mib: 64,
      }));
    } else if (phase === "load") {
      worker.postMessage({
        kind: "load",
        session_id: sessionId,
        cap_mib: 256,
        name: exportedFile.name,
        file: exportedFile,
      });
    }
  } else if (message.kind === "installed") {
    if (phase === "load") {
      const counts = message.summary.manifest.counts;
      roundtripCountsMatch =
        JSON.stringify(counts) === JSON.stringify(expectedCounts);
      replaceWorker("cap");
      return;
    }
    generations += 1;
    artifactBytes = message.summary.artifact_bytes;
    expectedCounts = message.summary.manifest.counts;
    worker.postMessage(JSON.stringify(previewCommand()));
  } else if (message.kind === "audit") {
    if (message.report) {
      phase = "export";
      worker.postMessage(JSON.stringify({
        kind: "export_arrow",
        session_id: sessionId,
        request_id: 2,
      }));
    } else {
      worker.postMessage(JSON.stringify({
        kind: "audit_step",
        session_id: sessionId,
        request_id: 1,
      }));
    }
  } else if (message.kind === "error") {
    clearTimeout(timeout);
    const responsive = maxHeartbeatGap < 200;
    const capRejected =
      phase === "cap" &&
      message.operation === "generation" &&
      message.error.includes("artifact limit");
    finish(
      responsive && roundtripCountsMatch && capRejected ? "passed" : "failed",
      !responsive
        ? "heartbeat gap exceeded 200 ms"
        : !roundtripCountsMatch
          ? "generate/audit/export/load roundtrip counts differ"
          : capRejected
            ? "responsive, roundtrip-safe, and cap-enforced"
            : `${message.operation}: ${message.error}`,
    );
  }
}

startWorker();
</script>
